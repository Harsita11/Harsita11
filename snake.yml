# Setup instructions:
# 1. In your GitHub profile repo (the one named exactly "harsita11", same as your username),
#    create the folder path: .github/workflows/
# 2. Save this file there as: .github/workflows/snake.yml
# 3. Commit and push it to the main branch.
# 4. Go to the repo's "Actions" tab and manually run the "generate snake" workflow once
#    (or just wait — it's scheduled to run daily anyway).
# 5. After it runs, a new branch called "output" will appear in your repo containing
#    the generated SVG. The README.md already points to it:
#    https://raw.githubusercontent.com/harsita11/harsita11/output/github-contribution-grid-snake.svg
# 6. It will now regenerate automatically every day to reflect your latest contributions.

name: generate snake

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: harsita11
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
